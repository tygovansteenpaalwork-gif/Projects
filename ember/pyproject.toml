[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-scan"
version = "0.1.0"
description = "Find backdoors and malware in Roblox scripts, models and places."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tygo Vansteenpaal" }]
requires-python = ">=3.9"
keywords = ["roblox", "luau", "security", "backdoor", "malware", "scanner", "rbxm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard>=0.21"]
dev = ["pytest>=7", "lz4>=4"]

[project.scripts]
ember = "ember.cli:main"

[project.urls]
Homepage = "https://github.com/tygovansteenpaalwork-gif/Projects/tree/main/ember"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
